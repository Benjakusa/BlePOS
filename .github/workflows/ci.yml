name: CI

on:
  push:
  pull_request:

jobs:
  application:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        include:
          - database: sqlite
            db_connection: sqlite
            db_database: database/database.sqlite
            db_username: root
          - database: mysql
            db_connection: mysql
            db_database: blepos_test
            db_username: root
          - database: postgres
            db_connection: pgsql
            db_database: blepos_test
            db_username: postgres
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: blepos_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: blepos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: ${{ matrix.db_connection }}
      DB_DATABASE: ${{ matrix.db_database }}
      DB_HOST: 127.0.0.1
      DB_USERNAME: ${{ matrix.db_username }}
      DB_PASSWORD: test-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, curl, dom, fileinfo, mbstring, openssl, pdo_mysql, pdo_pgsql, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: pcov
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: touch database/database.sqlite
        if: matrix.db_connection == 'sqlite'
      - run: php artisan migrate:fresh --seed --force
      - run: php artisan test --compact --coverage --min=1
      - run: php scripts/progress-check --verify-count
      - run: vendor/bin/pint --test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: php artisan db:seed --class=RestaurantTenantSeeder --force
      - run: php artisan db:seed --class=BrowserAcceptanceSeeder --force
      - run: npm run test:e2e
      - run: composer audit --no-interaction
      - run: npm audit --omit=dev
